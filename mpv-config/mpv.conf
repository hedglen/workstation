# Windows 11 / NVIDIA / ASUS 4K OLED. Windows HDR enabled in Settings.
vo=gpu-next
gpu-api=auto
hwdec=auto-safe
target-colorspace-hint=auto
osc=no
keep-open=yes

# A local file opens alone, not as a directory playlist.
autocreate-playlist=no

# Resume positions per movie; global volume handled by remember-volume.lua.
save-position-on-quit=yes
resume-playback=yes

# Stereo PCM output for JDS Labs Element IV and headphones.
alang=en,eng
audio-channels=stereo
volume=80
volume-max=100

# Select only properly flagged English forced subtitles by default.
slang=en,eng
subs-with-matching-audio=forced
subs-fallback=no
subs-fallback-forced=always
sub-auto=exact
sub-font=Segoe UI
sub-font-size=38
sub-border-size=2
sub-shadow-offset=1
sub-ass-override=no

screenshot-format=png
screenshot-directory=~~/screenshots
