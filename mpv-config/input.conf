# Mouse (original actions). Right-click opens mpv's built-in player menu.
MBTN_LEFT cycle pause
MBTN_MID quit
MBTN_RIGHT script-binding select/menu
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# Playback, seek, speed
SPACE quit
q quit-watch-later
Q quit
f cycle fullscreen
Alt+ENTER cycle fullscreen
ESC set fullscreen no
LEFT seek -5
RIGHT seek 5
Shift+LEFT seek -60
Shift+RIGHT seek 60
Ctrl+LEFT seek -300
Ctrl+RIGHT seek 300
, frame-back-step
. frame-step
[ multiply speed 0.9091
] multiply speed 1.1
BS set speed 1.0

# Audio and subtitles
UP add volume 2
DOWN add volume -2
Ctrl+UP add volume 10
Ctrl+DOWN add volume -10
m cycle mute
a cycle audio
A cycle audio down
s cycle sub
S cycle sub down
v cycle sub-visibility
z add sub-delay -0.05
Z add sub-delay 0.05
Ctrl+z set sub-delay 0
x add audio-delay -0.05
X add audio-delay 0.05
Ctrl+x set audio-delay 0

# General
F12 screenshot
Ctrl+S screenshot video
i script-binding stats/display-stats-toggle
I script-binding stats/display-page-4-toggle
k cycle ontop
PGUP playlist-prev
PGDWN playlist-next
F1 show-text "${playlist}" 3000
F2 show-text "${track-list}" 3000
F3 show-text "${chapter-list}" 3000

# Original Corsair Scimitar 12-button mapping. iCUE sends numpad keys.
# Button: 1=fullscreen 2=prev file 3=next file 4=favorites
#         5=frame back 6=frame forward 7=mute 8=A-B reset
#         9=mark A 10=pause+minimize 11=file loop 12=mark B
# Num Lock ON
KP7 cycle fullscreen
KP8 playlist-prev
Ctrl+KP8 add chapter -1
KP9 playlist-next
Ctrl+KP9 add chapter 1
KP4 script-message-to favorites favorites-open
Ctrl+KP4 script-message-to favorites favorites-add
Alt+KP4 script-message-to favorites favorites-remove-menu
KP5 frame-back-step
KP6 frame-step
KP1 cycle mute
KP_DEC cycle-values loop-file "inf" "no"

# Num Lock OFF
KP_HOME cycle fullscreen
KP_UP playlist-prev
Ctrl+KP_UP add chapter -1
KP_PGUP playlist-next
Ctrl+KP_PGUP add chapter 1
KP_LEFT script-message-to favorites favorites-open
Ctrl+KP_LEFT script-message-to favorites favorites-add
Alt+KP_LEFT script-message-to favorites favorites-remove-menu
KP_BEGIN frame-back-step
KP_RIGHT frame-step
KP_END cycle mute
KP_DEL cycle-values loop-file "inf" "no"

# Buttons 8/9/10/12 plus F20/21/22/24 are registered by Lua scripts.
